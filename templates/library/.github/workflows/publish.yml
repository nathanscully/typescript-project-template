name: publish

# Publishes to npm and JSR on a version tag (e.g. `git tag v1.2.3 && git push --tags`).
# Both registries use OIDC — no NPM_TOKEN / JSR_TOKEN secrets required. One-time setup:
#   npm:  npmjs.com → package → Trusted Publisher → this repo + workflow `publish.yml`
#   JSR:  jsr.io → package settings → link this GitHub repo
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC for npm provenance + JSR tokenless publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test

      # `prepack` runs the build and regenerates jsr.json.
      - name: Publish to npm
        run: npm publish

      - name: Publish to JSR
        run: npx jsr publish
